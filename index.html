<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App</title>
  <style>
    :root {
      --bg-main: #0f1015;
      --bg-sidebar: #07080a;
      --bg-card: #181a20;
      --accent: #2bc5b4;
      --text-main: #ffffff;
      --text-sub: #9095a0;
      --border-color: #262930;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 8, 10, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-card {
      background: var(--bg-card);
      padding: 32px;
      border-radius: 16px;
      width: 360px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      margin-bottom: 8px;
      color: var(--accent);
      text-align: center;
    }

    .auth-card p {
      color: var(--text-sub);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #101216;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .toggle-auth span {
      color: var(--accent);
      cursor: pointer;
      font-weight: bold;
    }

    /* Main App Layout */
    .app-container {
      display: flex;
      height: calc(100vh - 80px);
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-sidebar);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-right: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
      padding-left: 12px;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .user-profile {
      margin-top: auto;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info p {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-input {
      width: 320px;
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: #fff;
      outline: none;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .song-card:hover {
      transform: translateY(-4px);
      background: #20232b;
    }

    .song-card img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .song-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-card-artist {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: #090a0d;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 250px;
    }

    .now-playing img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 40%;
    }

    .control-btns {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-sub);
    }

    .progress-bar {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .volume-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 150px;
    }

    .volume-bar {
      width: 100px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Auth Modal -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h2 id="authTitle">Welcome Back</h2>
      <p id="authSub">Sign in to your account</p>
      <form id="authForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" required placeholder="Enter password">
        </div>
        <button type="submit" id="authSubmitBtn" class="auth-btn">Sign In</button>
      </form>
      <div class="toggle-auth">
        <span id="toggleAuthText">Don't have an account? Create one</span>
      </div>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">Music Box</div>
      <ul class="nav-menu">
        <li class="nav-item active">🏠 Home</li>
        <li class="nav-item">🔍 Browse</li>
        <li class="nav-item">📚 Library</li>
      </ul>
      <div class="user-profile">
        <div class="user-info">
          <p id="displayUsername">Guest</p>
        </div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="header-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search songs or artists..." >
      </div>

      <h2 class="section-title">Top Results</h2>
      <div id="songGrid" class="song-grid"></div>
    </main>
  </div>

  <!-- Player Bar -->
  <div class="player-bar">
    <div class="now-playing">
      <img id="playerCover" src="https://via.placeholder.com/48?text=Music" alt="Cover">
      <div>
        <div id="playerTitle" class="song-card-title">Select a Song</div>
        <div id="playerArtist" class="song-card-artist">--</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-btns">
        <button id="prevBtn" class="ctrl-btn">⏮</button>
        <button id="playBtn" class="ctrl-btn play-btn">▶</button>
        <button id="nextBtn" class="ctrl-btn">⏭</button>
      </div>
      <div class="progress-bar-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <span>🔊</span>
      <input type="range" id="volumeBar" class="volume-bar" value="80" min="0" max="100">
    </div>
  </div>

  <script>
    const audio = new Audio();
    let playlist = [];
    let currentIndex = 0;
    let isSignUp = false;

    // UI Elements
    const authOverlay = document.getElementById('authOverlay');
    const authForm = document.getElementById('authForm');
    const authTitle = document.getElementById('authTitle');
    const authSub = document.getElementById('authSub');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleAuthText = document.getElementById('toggleAuthText');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const displayUsername = document.getElementById('displayUsername');
    const logoutBtn = document.getElementById('logoutBtn');

    const searchInput = document.getElementById('searchInput');
    const songGrid = document.getElementById('songGrid');
    const playerCover = document.getElementById('playerCover');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const volumeBar = document.getElementById('volumeBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    // Auth Handlers
    toggleAuthText.addEventListener('click', () => {
      isSignUp = !isSignUp;
      authTitle.textContent = isSignUp ? "Create Account" : "Welcome Back";
      authSub.textContent = isSignUp ? "Sign up to start listening" : "Sign in to your account";
      authSubmitBtn.textContent = isSignUp ? "Create Account" : "Sign In";
      toggleAuthText.textContent = isSignUp ? "Already have an account? Sign In" : "Don't have an account? Create one";
    });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (isSignUp) {
        localStorage.setItem(`user_${username}`, password);
        alert('Account created! Logging in...');
      } else {
        const storedPassword = localStorage.getItem(`user_${username}`);
        if (storedPassword !== password) {
          alert('Invalid credentials');
          return;
        }
      }

      localStorage.setItem('currentUser', username);
      loginUser(username);
    });

    function loginUser(username) {
      displayUsername.textContent = username;
      authOverlay.style.display = 'none';
      fetchSongs(searchInput.value);
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('currentUser');
      authOverlay.style.display = 'flex';
    });

    // Check Auto-login
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
      loginUser(savedUser);
    }

    // iTunes API Fetch
    async function fetchSongs(term) {
      if (!term.trim()) return;
      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=12`;
        const res = await fetch(url);
        const data = await res.json();

        playlist = data.results.map(item => ({
          title: item.trackName,
          artist: item.artistName,
          cover: item.artworkUrl100.replace('100x100bb', '300x300bb'),
          src: item.previewUrl
        }));

        renderGrid();
      } catch (err) {
        console.error("iTunes API Fetch Error:", err);
      }
    }

    function renderGrid() {
      songGrid.innerHTML = '';
      playlist.forEach((track, idx) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
          <img src="${track.cover}" alt="cover">
          <div class="song-card-title">${track.title}</div>
          <div class="song-card-artist">${track.artist}</div>
        `;
        card.addEventListener('click', () => {
          currentIndex = idx;
          loadTrack(currentIndex);
        });
        songGrid.appendChild(card);
      });
    }

    function loadTrack(index) {
      if (!playlist[index]) return;
      const track = playlist[index];
      audio.src = track.src;
      playerTitle.textContent = track.title;
      playerArtist.textContent = track.artist;
      playerCover.src = track.cover;

      audio.play().then(() => {
        playBtn.textContent = '⏸';
      }).catch(() => {
        playBtn.textContent = '▶';
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused && audio.src) {
        audio.play();
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    });

    prevBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = volumeBar.value / 100;
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchSongs(searchInput.value);
    });
  </script>
</body>
</html>
