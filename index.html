<title>Music player</title>
<style>
    .music-player {
        transition: 0.3s ease;
    }

    /* Active / currently playing card */
    .music-player.playing {
        transform: scale(1.05);
        box-shadow: 0 0 0px rgba(70, 120, 255, 0.8);
    }

    .music-player.playing .card {
        animation: musicGlow 1.5s infinite alternate;
    }

    .music-player.playing img {
        animation: rotateAlbum 4s linear infinite;
        border-radius: 0px;
    }

    @keyframes musicGlow {
        from {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        to {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }
    }

    @keyframes rotateAlbum {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .playing-text {
        display: none;
        font-weight: bold;
        margin-top: 0px;
    }

    .music-player.playing .playing-text {
        display: block;
    }
</style>

<script>
    const players = document.querySelectorAll(".music-player");

    players.forEach(player => {

        const audio = player.querySelector("audio");

        // Create "Playing" text
        const playingText = document.createElement("div");
        playingText.className = "playing-text";
        playingText.innerHTML = "🎵 Playing...";
        player.querySelector(".card-body").appendChild(playingText);

        // When this song starts
        audio.addEventListener("play", () => {

            // Stop every other song
            document.querySelectorAll("audio").forEach(otherAudio => {
                if (otherAudio !== audio) {
                    otherAudio.pause();
                }
            });

            // Remove playing effect from all cards
            players.forEach(otherPlayer => {
                otherPlayer.classList.remove("playing");
            });

            // Add playing effect to current card
            player.classList.add("playing");
        });

        // When song is paused
        audio.addEventListener("pause", () => {
            player.classList.remove("playing");
        });

        // When song finishes
        audio.addEventListener("ended", () => {
            player.classList.remove("playing");
        });

    });

    // Get all audio elements
    const allSongs = document.querySelectorAll("audio");

    allSongs.forEach(song => {

        song.addEventListener("play", function () {

            allSongs.forEach(otherSong => {

                // If another song is playing
                if (otherSong !== song) {

                    // Pause it
                    otherSong.pause();

                    // Start it from beginning
                    otherSong.currentTime = 0;
                }

            });

        });

    });
</script>
